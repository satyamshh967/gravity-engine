name: CI

on:
  push:
  pull_request:

jobs:
  physics-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The physics core has no graphics dependency, so CI builds and tests it without raylib.
      - name: Configure
        run: cmake -S . -B build -DGRAVITY_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
